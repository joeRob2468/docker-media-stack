---

secrets:
  radarr-api:
    file: ./secrets/radarr-api.secret
  sonarr-api:
    file: ./secrets/sonarr-api.secret
  prowlarr-api:
    file: ./secrets/prowlarr-api.secret

services:
  sonarr:
    # See more: https://docs.linuxserver.io/images/docker-sonarr
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: always
    network_mode: service:gluetun
    env_file: ./env/arr.env
    secrets:
      - sonarr-api
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      # Pin the API key (linuxserver FILE__ prefix reads it from the secret)
      FILE__SONARR__AUTH__APIKEY: /run/secrets/sonarr-api
      # Login handled by Authentik forward auth (Traefik); /api still needs the API key
      SONARR__AUTH__METHOD: External
    volumes:
      - sonarr:/config
      - data:/media
    healthcheck:
      test: curl -f http://localhost:8989/ping || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      - traefik.http.routers.sonarr.middlewares=authentik@docker
      # /api stays reachable for API-key clients (phone apps); it rejects requests without a key
      - traefik.http.routers.sonarr-api.rule=Host(`sonarr.${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.sonarr-api.entrypoints=websecure
      - traefik.http.routers.sonarr-api.service=sonarr
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
      traefik:
        condition: service_healthy
        restart: true
      bittorrent:
        condition: service_healthy
        restart: true
      

  radarr:
    # See more: https://docs.linuxserver.io/images/docker-radarr
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: always
    network_mode: service:gluetun
    env_file: ./env/arr.env
    secrets:
      - radarr-api
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      # Pin the API key (linuxserver FILE__ prefix reads it from the secret)
      FILE__RADARR__AUTH__APIKEY: /run/secrets/radarr-api
      # Login handled by Authentik forward auth (Traefik); /api still needs the API key
      RADARR__AUTH__METHOD: External
    volumes:
      - radarr:/config
      - data:/media
    healthcheck:
      test: curl -f http://localhost:7878/ping || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.services.radarr.loadbalancer.server.port=7878
      - traefik.http.routers.radarr.middlewares=authentik@docker
      # /api stays reachable for API-key clients (phone apps); it rejects requests without a key
      - traefik.http.routers.radarr-api.rule=Host(`radarr.${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.radarr-api.entrypoints=websecure
      - traefik.http.routers.radarr-api.service=radarr
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
      traefik:
        condition: service_healthy
        restart: true
      bittorrent:
        condition: service_healthy
        restart: true

  byparr:
    # See more: https://docs.linuxserver.io/images/docker-prowlarr
    image: ghcr.io/datahub-local/byparr:main
    container_name: byparr
    restart: always
    network_mode: service:gluetun
    env_file: ./env/arr.env
    environment:
      TZ: ${TZ}
      USE_HEADLESS: 'true'
    #healthcheck:
    #  test: curl -f http://localhost:8191/health || exit 1
    #  interval: 10s
    #  timeout: 3s
    #  start_period: 60s
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
      traefik:
        condition: service_healthy
        restart: true
      sonarr:
        condition: service_healthy
        restart: true
      radarr:
        condition: service_healthy
        restart: true
  
  prowlarr:
    # See more: https://docs.linuxserver.io/images/docker-prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: always
    network_mode: service:gluetun
    env_file: ./env/arr.env
    secrets:
      - prowlarr-api
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      # Pin the API key (linuxserver FILE__ prefix reads it from the secret)
      FILE__PROWLARR__AUTH__APIKEY: /run/secrets/prowlarr-api
      # Login handled by Authentik forward auth (Traefik); /api still needs the API key
      PROWLARR__AUTH__METHOD: External
    volumes: 
      - prowlarr:/config
      - data:/media
    healthcheck:
      test: curl -f http://localhost:9696/ping || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
      - traefik.http.routers.prowlarr.middlewares=authentik@docker
      # /api stays reachable for API-key clients (phone apps); it rejects requests without a key
      - traefik.http.routers.prowlarr-api.rule=Host(`prowlarr.${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.prowlarr-api.entrypoints=websecure
      - traefik.http.routers.prowlarr-api.service=prowlarr
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
      traefik:
        condition: service_healthy
        restart: true
      bittorrent:
        condition: service_healthy
        restart: true
      sonarr:
        condition: service_healthy
        restart: true
      radarr:
        condition: service_healthy
        restart: true
      byparr:
        condition: service_started
        restart: true

  unpackerr:
    # See more: https://unpackerr.zip/docs/install/compose
    image: golift/unpackerr
    container_name: unpackerr
    restart: always
    secrets:
      - radarr-api
      - sonarr-api
    env_file: ./env/arr.env
    environment:
      TZ: ${TZ}
    volumes:
      - data:/media
      - unpackerr:/config
    depends_on:
      sonarr:
        condition: service_healthy
        restart: true
      radarr:
        condition: service_healthy
        restart: true

networks:
  default:
    name: media_network
    driver: bridge
    attachable: true

volumes:
  data: # Sonarr, Radarr, Prowlarr, and Unpackerr data mount
    driver: local-persist
    driver_opts:
      mountpoint: "${MEDIA_VOLUME}/data"

  sonarr: # Sonarr app data.
    driver: local-persist
    driver_opts:
      mountpoint: "${MEDIA_VOLUME}/docker_data/sonarr"

  radarr: # Radarr app data.
    driver: local-persist
    driver_opts:
      mountpoint: "${MEDIA_VOLUME}/docker_data/radarr"

  prowlarr: # Prowlarr app data.
    driver: local-persist
    driver_opts:
      mountpoint: "${MEDIA_VOLUME}/docker_data/prowlarr"

  unpackerr: # unPackerr app data.
    driver: local-persist
    driver_opts:
      mountpoint: "${MEDIA_VOLUME}/docker_data/unpackerr"
