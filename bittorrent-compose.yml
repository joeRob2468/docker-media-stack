---

secrets:
  bittorrent-user:
    file: ./secrets/bittorrent-user.secret
  bittorrent-password:
    file: ./secrets/bittorrent-password.secret
  gluetun-apikey:
    file: ./secrets/gluetun-apikey.secret

services:
  bittorrent:
    # See more: https://docs.linuxserver.io/images/docker-qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: bittorrent
    restart: always
    network_mode: service:gluetun
    env_file: ./env/bittorrent.env
    secrets:
      - bittorrent-user
      - bittorrent-password
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - bittorrent:/config
      - torrent:/data/torrents
    # libtorrent keeps its DHT/tracker sockets on the old tunnel after gluetun reconnects
    # (DHT drops to 0, every torrent stalls at 0 peers) until qBittorrent restarts. Unhealthy
    # when DHT has no nodes; ofelia (scheduler-compose.yml) restarts it once unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "c=/tmp/healthcheck.cookie; curl -sf -c $$c --data-urlencode \"username=$$(cat /run/secrets/bittorrent-user)\" --data-urlencode \"password=$$(cat /run/secrets/bittorrent-password)\" http://localhost:8088/api/v2/auth/login >/dev/null && n=$$(curl -sf -b $$c http://localhost:8088/api/v2/transfer/info | jq .dht_nodes); curl -s -b $$c -X POST http://localhost:8088/api/v2/auth/logout >/dev/null; rm -f $$c; [ \"$${n:-0}\" -gt 0 ]"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
      start_interval: 5s
    labels:
      - traefik.enable=true
      - traefik.http.routers.bittorrent.rule=Host(`bittorrent.${DOMAIN}`)
      - traefik.http.routers.bittorrent.entrypoints=websecure
      - traefik.http.services.bittorrent.loadbalancer.server.port=8088
      - traefik.http.routers.bittorrent.middlewares=authentik@docker
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
      traefik:
        condition: service_healthy
        restart: true

  bittorrent_port_forwarder:
    # See more: https://github.com/mjmeli/qbittorrent-port-forward-gluetun-server
    image: mjmeli/qbittorrent-port-forward-gluetun-server
    container_name: bittorrent_port_forwarder
    restart: always
    secrets:
      - bittorrent-user
      - bittorrent-password
      - gluetun-apikey
    env_file: ./env/bittorrent.env
    environment:
      TZ: ${TZ}
    # Image reads QBT_*/GTN_APIKEY from env only; load them from the secret files at startup
    command: ["sh", "-c", "export QBT_USERNAME=\"$$(cat /run/secrets/bittorrent-user)\" QBT_PASSWORD=\"$$(cat /run/secrets/bittorrent-password)\" GTN_APIKEY=\"$$(cat /run/secrets/gluetun-apikey)\"; exec /usr/src/app/entrypoint.sh"]
    depends_on:
      bittorrent:
        condition: service_healthy
        restart: true

networks:
  default:
    name: media_network
    driver: bridge
    attachable: true

volumes:
  torrent: # torrent data mount
    driver: local-persist
    driver_opts:
      mountpoint: "${MEDIA_VOLUME}/data/torrents"

  bittorrent: # qBittorrent app data.
    driver: local-persist
    driver_opts:
      mountpoint: "${MEDIA_VOLUME}/docker_data/bittorrent"
