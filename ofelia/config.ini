; Jobs that need the Docker socket. Ofelia drops label-defined job-run jobs with host
; mounts (allow-host-jobs-from-labels), but trusts this file. Other jobs stay on labels.

; Docker doesn't restart unhealthy containers itself; see the bittorrent healthcheck.
[job-run "restart-unhealthy-bittorrent"]
schedule = @every 5m
image = docker:28-cli
; Ofelia runs job-run containers as nobody by default, which can't open the socket
; (root:docker 660). Root works on any host, whatever the docker group's GID.
user = root
volume = /var/run/docker.sock:/var/run/docker.sock
; No pipe, so a socket error fails the job instead of passing silently
command = sh -c "ids=$(docker ps -q --filter name=^bittorrent$ --filter health=unhealthy) && { [ -z \"$ids\" ] || docker restart $ids; }"
no-overlap = true
