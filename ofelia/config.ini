; Jobs that need the Docker socket. Ofelia drops label-defined job-run jobs with host
; mounts (allow-host-jobs-from-labels), but trusts this file. Other jobs stay on labels.

; Docker doesn't restart unhealthy containers itself; see the bittorrent healthcheck.
[job-run "restart-unhealthy-bittorrent"]
schedule = @every 5m
image = docker:28-cli
volume = /var/run/docker.sock:/var/run/docker.sock
command = sh -c "docker ps -q --filter name=^bittorrent$ --filter health=unhealthy | xargs -r docker restart"
no-overlap = true
