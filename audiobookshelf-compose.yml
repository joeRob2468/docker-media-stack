---
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    user: "${PUID}:${PGID}"
    restart: always
    env_file: ./env/audiobookshelf.env
    environment:
      TZ: ${TZ}
    volumes:
      - books:/audiobooks
#      - podcasts:/podcasts
      - config:/config
      - metadata:/metadata
      # Maintenance scripts (audiobookshelf/*.js), run inside this container
      - ./audiobookshelf:/scripts:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.audiobookshelf.rule=Host(`audiobookshelf.${DOMAIN}`)
      - traefik.http.routers.audiobookshelf.entrypoints=websecure
      - traefik.http.services.audiobookshelf.loadbalancer.server.port=13378
      # Nightly metadata cleanup, rules only (scheduler-compose.yml runs it)
      - ofelia.enabled=true
      - ofelia.job-exec.clean-metadata.schedule=0 30 3 * * *
      - ofelia.job-exec.clean-metadata.command=sh -c "cat /scripts/admin-key.js /scripts/clean-metadata.js | node - --apply"
      - ofelia.job-exec.clean-metadata.no-overlap=true
    depends_on:
      traefik:
        condition: service_healthy
        restart: true

networks:
  default:
    name: media_network
    driver: bridge
    attachable: true

volumes:
  books: # Books library
    driver: local-persist
    driver_opts:
      mountpoint: "${MEDIA_VOLUME}/data/media/books"
#  podcasts: # Podcasts library
#    driver: local-persist
#    driver_opts:
#      mountpoint: "${MEDIA_VOLUME}/data/media/podcasts"
  config: # Config
    driver: local-persist
    driver_opts:
      mountpoint: "${MEDIA_VOLUME}/docker_data/audiobookshelf/config"
  metadata: # Metadata
    driver: local-persist
    driver_opts:
      mountpoint: "${MEDIA_VOLUME}/docker_data/audiobookshelf/metadata"
