# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Media stack SSO: Plex login source, admin group, OIDC apps for Shelfmark, CWA, Audiobookshelf.
# Client secrets come from docker secrets (secrets/authentik-<app>-oidc.secret).
# Plex token comes from secrets/authentik-plex-token.secret.
version: 1
metadata:
  name: Media stack SSO
entries:
  # Plex login: only accounts with access to the PLEX_SERVER_ID server (allow_friends off)
  - model: authentik_sources_plex.plexsource
    id: source-plex
    identifiers:
      slug: plex
    attrs:
      name: Plex
      enabled: true
      client_id: !File /run/secrets/authentik-plex-client-id
      allowed_servers:
        - !Env PLEX_SERVER_ID   # Plex server's machine identifier (.env)
      allow_friends: false
      plex_token: !File /run/secrets/authentik-plex-token
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
      user_matching_mode: identifier

  # Show the Plex button on the login page
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      sources:
        - !KeyOf source-plex

  - model: authentik_core.group
    identifiers:
      name: media-admins

  # Apps only link existing users by email when email_verified is true. Authentik's default
  # email scope sends false (it can't vouch for Plex emails); small trusted user base, so trust them.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email-verified
    identifiers:
      name: email-verified
    attrs:
      scope_name: email
      description: Email address (marked verified)
      expression: |
        return {"email": request.user.email, "email_verified": True}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-shelfmark
    identifiers:
      name: Shelfmark
    attrs: &provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-email-verified
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      client_id: !File /run/secrets/authentik-shelfmark-client-id
      client_secret: !File /run/secrets/authentik-shelfmark-oidc
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://books.%s/api/auth/oidc/callback", !Env DOMAIN]

  - model: authentik_core.application
    id: app-shelfmark
    identifiers:
      slug: shelfmark
    attrs:
      name: Shelfmark
      provider: !KeyOf provider-shelfmark
      meta_launch_url: !Format ["https://books.%s", !Env DOMAIN]

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-cwa
    identifiers:
      name: Calibre-Web-Automated
    attrs:
      <<: *provider
      client_id: !File /run/secrets/authentik-cwa-client-id
      client_secret: !File /run/secrets/authentik-cwa-oidc
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://library.%s/login/generic/authorized", !Env DOMAIN]

  - model: authentik_core.application
    id: app-cwa
    identifiers:
      slug: cwa
    attrs:
      name: Calibre-Web-Automated
      provider: !KeyOf provider-cwa
      meta_launch_url: !Format ["https://library.%s", !Env DOMAIN]

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-audiobookshelf
    identifiers:
      name: Audiobookshelf
    attrs:
      <<: *provider
      client_id: !File /run/secrets/authentik-audiobookshelf-client-id
      client_secret: !File /run/secrets/authentik-audiobookshelf-oidc
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://audiobookshelf.%s/audiobookshelf/auth/openid/callback", !Env DOMAIN]
        - matching_mode: strict
          url: !Format ["https://audiobookshelf.%s/audiobookshelf/auth/openid/mobile-redirect", !Env DOMAIN]

  - model: authentik_core.application
    id: app-audiobookshelf
    identifiers:
      slug: audiobookshelf
    attrs:
      name: Audiobookshelf
      provider: !KeyOf provider-audiobookshelf
      meta_launch_url: !Format ["https://audiobookshelf.%s", !Env DOMAIN]

  # Block the local akadmin account from the media apps. Without this, an open akadmin session in
  # Authentik silently logs "Login with Plex" into the apps as akadmin (and auto-creates accounts).
  - model: authentik_policies_expression.expressionpolicy
    id: policy-deny-akadmin
    identifiers:
      name: deny-akadmin
    attrs:
      expression: |
        if request.user.username == "akadmin":
            ak_message("Signed in to Authentik as akadmin. Sign out of Authentik first, then use Login with Plex.")
            return False
        return True

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-shelfmark
      policy: !KeyOf policy-deny-akadmin
    attrs:
      order: 0
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-cwa
      policy: !KeyOf policy-deny-akadmin
    attrs:
      order: 0
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-audiobookshelf
      policy: !KeyOf policy-deny-akadmin
    attrs:
      order: 0
      enabled: true
