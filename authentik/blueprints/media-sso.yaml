# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Media stack SSO: admin group + OIDC apps for Shelfmark, CWA, Audiobookshelf.
# Client secrets come from docker secrets (secrets/authentik-<app>-oidc.secret).
# Not covered: Plex source (needs a Plex login in the browser to set up).
version: 1
metadata:
  name: Media stack SSO
entries:
  - model: authentik_core.group
    identifiers:
      name: media-admins

  # Apps only link existing users by email when email_verified is true. Authentik's default
  # email scope sends false (it can't vouch for Plex emails); small trusted user base, so trust them.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email-verified
    identifiers:
      name: email-verified
    attrs:
      scope_name: email
      description: Email address (marked verified)
      expression: |
        return {"email": request.user.email, "email_verified": True}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-shelfmark
    identifiers:
      name: Shelfmark
    attrs: &provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-email-verified
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      client_id: <client-id>
      client_secret: !File /run/secrets/authentik-shelfmark-oidc
      redirect_uris:
        - matching_mode: strict
          url: https://books.example.com/api/auth/oidc/callback

  - model: authentik_core.application
    identifiers:
      slug: shelfmark
    attrs:
      name: Shelfmark
      provider: !KeyOf provider-shelfmark
      meta_launch_url: https://books.example.com

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-cwa
    identifiers:
      name: Calibre-Web-Automated
    attrs:
      <<: *provider
      client_id: <client-id>
      client_secret: !File /run/secrets/authentik-cwa-oidc
      redirect_uris:
        - matching_mode: strict
          url: https://library.example.com/login/generic/authorized

  - model: authentik_core.application
    identifiers:
      slug: cwa
    attrs:
      name: Calibre-Web-Automated
      provider: !KeyOf provider-cwa
      meta_launch_url: https://library.example.com

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-audiobookshelf
    identifiers:
      name: Audiobookshelf
    attrs:
      <<: *provider
      client_id: <client-id>
      client_secret: !File /run/secrets/authentik-audiobookshelf-oidc
      redirect_uris:
        - matching_mode: strict
          url: https://audiobookshelf.example.com/audiobookshelf/auth/openid/callback
        - matching_mode: strict
          url: https://audiobookshelf.example.com/audiobookshelf/auth/openid/mobile-redirect

  - model: authentik_core.application
    identifiers:
      slug: audiobookshelf
    attrs:
      name: Audiobookshelf
      provider: !KeyOf provider-audiobookshelf
      meta_launch_url: https://audiobookshelf.example.com
