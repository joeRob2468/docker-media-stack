---
services:
  ofelia:
    # See more: https://github.com/netresearch/ofelia
    # Runs scheduled jobs inside other containers. Jobs are labels on the target service
    # (ofelia.job-exec.<name>.schedule/command), so each schedule lives next to its service.
    image: ghcr.io/netresearch/ofelia:latest
    container_name: ofelia
    restart: always
    # Labels only, no config file
    command: daemon
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # job-run jobs start a fresh container, so their labels live here, not on a target service.
    # Docker doesn't restart unhealthy containers itself; see the bittorrent healthcheck.
    labels:
      - ofelia.enabled=true
      - ofelia.job-run.restart-unhealthy-bittorrent.schedule=@every 5m
      - ofelia.job-run.restart-unhealthy-bittorrent.image=docker:28-cli
      - ofelia.job-run.restart-unhealthy-bittorrent.volume=/var/run/docker.sock:/var/run/docker.sock
      - ofelia.job-run.restart-unhealthy-bittorrent.command=sh -c "docker ps -q --filter name=^bittorrent$$ --filter health=unhealthy | xargs -r docker restart"
      - ofelia.job-run.restart-unhealthy-bittorrent.no-overlap=true

networks:
  default:
    name: media_network
    driver: bridge
    attachable: true
